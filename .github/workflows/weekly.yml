# The weekly lane: slow quality signals that never block a merge. Each job restores its
# tool's incremental state, runs, prints the scores to the job summary and uploads the
# reports. docs/qa/mutation-testing.md explains how to read a run.
name: Weekly

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-mutation:
    name: Mutation (Python, mutmut)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Install the locked environment
        run: |
          python -m pip install uv==0.8.22
          python -m uv sync --locked --extra dev
      - name: Restore mutmut state
        uses: actions/cache@v6
        with:
          path: analytics/mutants
          key: mutmut-${{ github.ref_name }}-${{ hashFiles('analytics/uv.lock', 'analytics/pyproject.toml') }}
          restore-keys: mutmut-${{ github.ref_name }}-
      - name: Run mutmut
        # --extra dev keeps uv from syncing the development tools away before running.
        run: python -m uv run --extra dev mutmut run || echo "mutmut exited with $?"
      - name: Results and CI stats
        run: |
          python -m uv run --extra dev mutmut results || true
          python -m uv run --extra dev mutmut export_cicd_stats
      - name: Job summary
        run: |
          python ../scripts/mutation_summary.py --mutmut mutants/mutmut-cicd-stats.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutmut
          path: |
            analytics/mutants/mutmut-cicd-stats.json
            analytics/mutants/mutmut-stats.json
            analytics/mutants/mutmut-debug.log

  java-mutation:
    name: Mutation (Java, PIT)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Restore PIT history
        uses: actions/cache@v6
        with:
          path: api/.pit-history
          key: pit-${{ github.ref_name }}-${{ hashFiles('api/pom.xml') }}
          restore-keys: pit-${{ github.ref_name }}-
      - name: Run PIT
        run: |
          mkdir -p api/.pit-history
          bash ./api/mvnw -f api/pom.xml -Pmutation -Djacoco.skip=true --batch-mode --no-transfer-progress \
            test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Job summary
        run: python3 scripts/mutation_summary.py --pit api/target/pit-reports/mutations.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pit-reports
          path: api/target/pit-reports/

  web-mutation:
    name: Mutation (web, Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the locked dependencies
        run: |
          npm install --global npm@11.11.0
          npm --prefix web ci --no-audit --no-fund
      - name: Restore Stryker incremental state
        uses: actions/cache@v6
        with:
          path: web/reports/stryker-incremental.json
          key: stryker-${{ github.ref_name }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: stryker-${{ github.ref_name }}-
      - name: Run Stryker
        run: npm --prefix web run mutation
      - name: Job summary
        run: python3 scripts/mutation_summary.py --stryker web/reports/mutation/mutation.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stryker-reports
          path: web/reports/
