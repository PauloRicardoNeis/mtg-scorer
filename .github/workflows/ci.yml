name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  catalog:
    name: Verified Python -> PostgreSQL -> Java -> browser
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CATALOG_ADMIN_DSN: postgresql://postgres:local-ci-only@127.0.0.1:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pin package manager and install browser system libraries
        run: |
          npm install --global npm@11.11.0
          python scripts/demo.py install
          node web/node_modules/playwright/cli.js install-deps chromium
      - name: Build, check contracts, publish, query and exercise guest browser
        run: python scripts/demo.py verify --skip-install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-verification
          path: |
            .local/mtg_verify_*/api.log
            .local/mtg_verify_*/web.log
            .local/mtg_verify_*/measurements.json
            web/playwright-report/
            web/test-results/
            api/target/surefire-reports/
