[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-scorer"
version = "0.2.0"
description = "Historical MTG analytics for staple and build-around discovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.2,<2",
  "ijson>=3.3,<4",
  "jsonschema==4.26.0",
  "psycopg[binary]==3.2.10",
]

[project.scripts]
mtg-scorer = "mtg_scorer.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "openapi-spec-validator==0.7.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
