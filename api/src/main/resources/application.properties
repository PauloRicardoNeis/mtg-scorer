spring.application.name=mtg-scorer-api
spring.mvc.problemdetails.enabled=true
spring.datasource.url=${CATALOG_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/mtg_catalog}
spring.datasource.username=${CATALOG_DB_USER:catalog_api_local}
spring.datasource.password=${CATALOG_DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.flyway.enabled=${CATALOG_MIGRATE:false}
spring.flyway.url=${CATALOG_MIGRATION_URL:${spring.datasource.url}}
spring.flyway.user=${CATALOG_MIGRATION_USER:postgres}
spring.flyway.password=${CATALOG_MIGRATION_PASSWORD:}
management.health.db.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,catalog
management.endpoint.health.group.liveness.include=livenessState

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

springdoc.show-actuator=true
springdoc.paths-to-match=/api/v1/**,/actuator/health
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
